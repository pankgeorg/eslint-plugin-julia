name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # JavaScript with @eslint/js + eslint-plugin-n; the repo's own Julia scripts with the plugin.
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: Package smoke test (${{ matrix.os }}, ESLint ${{ matrix.eslint }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, eslint: '^10' }
          - { os: ubuntu-latest, eslint: '^9.39' }
          - { os: windows-latest, eslint: '^10' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm pack, install the tarball next to ESLint in a scratch project, lint .jl files via the CLI.
      - run: node scripts/smoke-pack.mjs "${{ matrix.eslint }}"

  code-scanning:
    # Dog-food: lint this repository (its JavaScript and Julia scripts) and upload SARIF,
    # the same way docs/usage.md suggests for Julia projects.
    name: Code scanning (SARIF)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint.sarif
          category: eslint
